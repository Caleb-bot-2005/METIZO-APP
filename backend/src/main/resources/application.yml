spring:
  application:
    name: metizo-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/metizo}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # Flyway (below) owns the schema now; Hibernate only checks at boot that
      # the entities still match it, and fails fast on drift instead of
      # silently altering tables.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    show-sql: false
  flyway:
    # This DB's tables were originally created by Hibernate's ddl-auto: update.
    # baseline-on-migrate lets Flyway adopt it without re-running V1's CREATE
    # TABLEs against tables that already exist — it just records V1 as already
    # applied. A fresh/empty database (new env, CI, local dev) is unaffected by
    # baselining and runs V1 for real.
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: "Schema as created by Hibernate ddl-auto before Flyway adoption"
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: ${SERVER_PORT:8080}

metizo:
  resend:
    # Used to email password-reset codes. Sandbox sender (onboarding@resend.dev)
    # works immediately with any Resend account, no domain verification needed.
    api-key: ${RESEND_API_KEY:}
    from: ${RESEND_FROM:METIZO <onboarding@resend.dev>}
  paystack:
    # Test/live secret key from dashboard.paystack.com/#/settings/developer.
    # Server-side only — never sent to the mobile app.
    secret-key: ${PAYSTACK_SECRET_KEY:}
    # Where Paystack's hosted checkout redirects after the customer finishes.
    # We don't run a webserver page there — the mobile app's WebView watches for
    # this URL to know the checkout is done, then verifies the reference itself.
    callback-url: ${PAYSTACK_CALLBACK_URL:https://standard.paystack.co/close}
  security:
    jwt:
      # Base64-encoded 256-bit secret. Override in production via env var.
      secret: ${JWT_SECRET:bWVzdGl6by1zdXBlci1zZWNyZXQta2V5LWNoYW5nZS1tZS1pbi1wcm9kdWN0aW9uLTEyMw==}
      expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  escrow:
    # Platform commission charged on each released job (10%).
    commission-rate: 0.10
  uploads:
    # Directory where before/after work photos are stored (relative to working dir).
    dir: ${METIZO_UPLOADS_DIR:uploads}
  cors:
    # Frontend origins allowed to call the API. Override via env var in production,
    # e.g. METIZO_CORS_ALLOWED_ORIGINS=https://metizo.app
    # Only relevant for Expo Web (browser). Native iOS/Android builds and Expo Go
    # do not enforce CORS. Defaults cover Expo Web (8081 / 19006) and common web dev servers.
    allowed-origins: ${METIZO_CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:19006,http://localhost:3000,http://localhost:5173,http://localhost:4200}
